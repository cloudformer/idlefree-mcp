name: publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    permissions:
      id-token: write
    uses: cloudformer/redefine-aws-serverless-workflow/.github/workflows/reusable-publish.yml@main
    with:
      install: "pytest"
      package-dir: "."   # pyproject.toml is at the repo root, not in client/
    secrets: inherit
